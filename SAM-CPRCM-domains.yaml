SAM-12:
  input: geojson
  data: data/SAM-12.geojson
  style:
    edgecolor: black

FPS-SESA-minimum:
  input: bbox
  data: [-75, -48, -35, -17]
  style:
    facecolor: red
    alpha: 0.2

FPS-ML-SSA-minimum:
  input: bbox
  data: [-75, -42, -37, -17]
  style:
    facecolor: blue
    alpha: 0.2

cities:
  input: cities
  data:
    - Buenos Aires
    - São Paulo

default:
  figsize: [11, 9]
  CRS:
    pole_longitude: -56.06
    pole_latitude: 70.60
    central_rotated_longitude: 180.0
  lonlat_extent: [-89, -30, -58, 19]
  netcdf:
    style:
      linestyle: solid
      linewidth: 1.5
      facecolor: none
      edgecolor: red
  geojson:
    style:
      linestyle: solid
      linewidth: 1.5
      facecolor: none
      edgecolor: red
  points:
    style: &point
      linestyle: ''
      marker: 'o'
      color: 'r'
  cities:
    style: *point
  corners:
    style:
      linestyle: solid
      linewidth: 1.5
  bbox:
    style:
      linestyle: solid
      linewidth: 1.5
