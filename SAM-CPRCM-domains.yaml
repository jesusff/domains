SAM-12:
  input: geojson
  data: data/SAM-12.geojson
  style:
    edgecolor: black

SAM-25-SENAMHI-PER:
  input: geojson
  data: data/SAM-25-SENAMHI-PER.geojson
  style:
    edgecolor: black
    linestyle: dashed

CAM-25-CNRM:
  input: geojson
  data: data/CAM-25-CNRM.geojson
  style:
    edgecolor: grey
    linestyle: dashed

FPS-SESA-minimum:
  input: bbox
  data: [-75, -48, -35, -17]
  style:
    facecolor: red
    alpha: 0.2

FPS-ML-SSA-minimum:
  input: bbox
  data: [-75, -42, -37, -17]
  style:
    facecolor: blue
    alpha: 0.2

CSAM-3-ICTP:
  input: geojson
  data: data/CSAM-3-ICTP.geojson
  style:
    edgecolor: orange

CSAM-3-ICTP-fulldom:
  input: geojson
  data: data/CSAM-3-ICTP-fulldom.geojson
  style:
    edgecolor: orange
    linestyle: dashed

cities:
  input: cities
  data:
    - Buenos Aires
    - São Paulo

default:
  figsize: [11, 6]
  CRS:
    pole_longitude: -56.06
    pole_latitude: 70.60
    central_rotated_longitude: 180.0
  lonlat_extent: [-125, 30, -50, 40]
  netcdf:
    style:
      linestyle: solid
      linewidth: 1.5
      facecolor: none
      edgecolor: red
  geojson:
    style:
      linestyle: solid
      linewidth: 1.5
      facecolor: none
      edgecolor: red
  points:
    style: &point
      linestyle: ''
      marker: 'o'
      color: 'r'
  cities:
    style: *point
  corners:
    style:
      linestyle: solid
      linewidth: 1.5
  bbox:
    style:
      linestyle: solid
      linewidth: 1.5
