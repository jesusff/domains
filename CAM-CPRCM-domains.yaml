"CORDEX CAM-12":
  input: geojson
  data: data/CAM-12.geojson
  style:
    facecolor: none
    edgecolor: black
    linewidth: 2
#
# Convection-permitting domains in Central America
#
"CORDEX FPS-TC-Car-3":
  input: geojson
  data: data/FPS-TC-Car-3.geojson
  style:
    facecolor: none
    edgecolor: green
    linestyle: dotted

EUCP-CAR-4:
  input: bbox
  data: [-86, -51, 7, 27]
  style:
    edgecolor: gray
    linestyle: dotted
    facecolor: none

I4C-CAR-minimum:
  input: bbox
  data: [-87, -58, 10, 28]
  style:
    facecolor: red
    alpha: 0.2

I4C-ICTP-CAR-4:
  input: geojson
  data: data/ICTP-CAR-4.geojson
  style:
    facecolor: none
    edgecolor: red

I4C-NORCE-CAR-4:
  input: geojson
  data: data/NORCE-CAR-4.geojson
  style:
    edgecolor: blue

default:
  figsize: [10, 5]
  CRS:
    pole_longitude: 113.98
    pole_latitude: 75.74
    central_rotated_longitude: 0.0
  lonlat_extent: [-118, -27, -17, 37]
  netcdf:
    style:
      linestyle: solid
      linewidth: 1.5
      facecolor: none
      edgecolor: red
  geojson:
    style:
      linestyle: solid
      linewidth: 1.5
      facecolor: none
      edgecolor: red
  points:
    style: &point
      linestyle: ''
      marker: 'o'
      color: 'r'
  cities:
    style: *point
  corners:
    style:
      linestyle: solid
      linewidth: 1.5
  bbox:
    style:
      linestyle: solid
      linewidth: 1.5
