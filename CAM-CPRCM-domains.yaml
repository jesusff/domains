  data: data/CAM-12.geojson
  style:
    facecolor: none
    edgecolor: black
    linewidth: 2

"CORDEX CAM-12 new":
  input: geojson
  data: data/CAM-12-new.geojson
  style:
    facecolor: none
    edgecolor: blue
    linewidth: 2

